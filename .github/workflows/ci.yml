name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check hermes_web_agent/ tests/

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio
      - name: Run unit tests (skip integration)
        run: pytest tests/ -v --tb=short -x -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio
      - run: pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Run integration tests
        run: pytest tests/ -v --tb=short -m "integration"
      - name: Run manual tests (if any)
        continue-on-error: true
        run: python -m pytest tests/integration/ -v --tb=short 2>/dev/null || echo "No manual tests"

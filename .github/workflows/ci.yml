name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint with Ruff
        run: ruff check hermes_web_agent/

      - name: Type check with mypy
        run: mypy hermes_web_agent/ --ignore-missing-imports --check-untyped-defs

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
          pip install mcp

      - name: Install Playwright browsers
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  module-smoke:
    name: Import Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify all modules import cleanly
        run: |
          python -c "
            import hermes_web_agent
            from hermes_web_agent import core
            from hermes_web_agent import bridges
            from hermes_web_agent import utils
            from hermes_web_agent.bridges import base, chatgpt, claude, deepseek
            from hermes_web_agent.utils import anti_detection
            print('✅ All modules imported successfully')
          "

      - name: Verify MCP module (optional dep)
        run: |
          pip install mcp
          python -c "
            from hermes_web_agent.mcp import server
            print('✅ MCP module imported successfully')
          "
